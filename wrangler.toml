# Cloudflare Pages (projeto fantasia-dado): o site estático fica em public/ e as Pages Functions
# (métricas e painel) em functions/. Deploy: npx wrangler pages deploy
name = "fantasia-dado"
pages_build_output_dir = "./public"
compatibility_date = "2026-10-01"

# Banco das métricas. Criar uma vez: npx wrangler d1 create crew-metricas (e colar o id aqui)
[[d1_databases]]
binding = "DB"
database_name = "crew-metricas"
database_id = "14a41d7d-156f-44c6-a755-d4a3c8c00301"
